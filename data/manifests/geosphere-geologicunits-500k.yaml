caveats: |
  - Priority 6 (last) in the merged Dolomites geology: fills the Austrian part of the terrain bbox (Ötztal, Stubai, Zillertal,
    Hohe Tauern, East Tyrol). 1:500,000, 20x coarser than the South Tyrol map: context only; the meta gives its scale and a
    scale_note, and its polygons must not be read as detailed mapping at z11-13.
  - 647 polygons of 33 units intersect the bbox; each unit has one GeologicEvent. Ages: olderNamedAge / youngerNamedAge are
    INSPIRE GeochronologicEra names, which are ICS chart names (mapped one to one, checked by the build). Basement units carry
    wide ranges (e.g. Neoproterozoic - Devonian), which give honest but vague envelopes coloured by the younger bound.
  - Uncoloured by rule (geology_age_mapping.json, sources.geosphere-geologicunits-500k): "Glaciers, permanent snow cover"
    (unit 1, 73 polygons in the bbox) and "water bodies" (unit 65, 4 polygons); the 4 polygons of "metasediment with eclogite"
    whose event is 'subduction' (the age of a metamorphic/tectonic event, not of formation). 'magmatic process' on orthogneiss
    and amphibolite is taken as the protolith age (judgement call).
  - Finer GeoSphere alternatives cover the Austrian part only partly: INSPIRE 1:50,000 (CC BY 4.0, GPKG 1 027 649 536 bytes,
    37% of the Austrian gap, sheets merged without edge matching) and 1:200,000 (CC BY 4.0, 25%, East Tyrol only).
  - No edge matching with the Italian maps along the border; the higher-priority Italian and Swiss maps win on overlaps.
processing:
  - step: "Download the GeoPackage (manual, 2026-09-12), SHA-256. No fetch script."
