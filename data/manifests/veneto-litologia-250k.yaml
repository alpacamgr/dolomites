caveats: |
  - A regional lithology map at 1:250,000: polygons are lithological classes (uc_lege), much coarser than the
    1:10,000 provincial maps. In the merged archive it only fills what South Tyrol and Trentino do not cover
    (Belluno: Civetta, Cortina, Marmolada north-east flank, Pale di San Martino east side).
  - Ages are the text in the final parentheses of depositi_a ("Dolomia Principale (Trias sup.)"; age_basis source). 18 of
    the 49 classes in the Dolomites bbox have no age there. Since 2026-09-12: 8 formation classes are dated by joining
    the formation names they list to the Trentino unit legend, the South Tyrol CARG attributes or ISPRA catalogue / sheet
    notes, as the envelope of those ages (age_basis legend_join; e.g. "Dolomia Cassiana, D. dello Sciliar, D. del Serla
    Sup., C. della Marmolada" -> Anisian-Carnian); 8 Quaternary deposit classes (moraine, alluvial, fluvioglacial,
    lacustrine, eluvial-colluvial, scree, landslide) take the Quaternary as a whole from the Trentino map's classification
    of the same deposit types as "Depositi quaternari" (age_basis class_rule); "Acque interne" and "Sequenze metamorfiche di
    Agordo, Recoaro e Comelico" stay null. Every row, its evidence and the judgement calls (e.g. 'et al.' classes dated from
    the named formations only; the Formazione di Auronzo dated through its synonymy with the lower San Cassiano Formation)
    are in geology_age_mapping.json. 1 class has only one bound (Ponte Gardena: 'Carbonifero sup.' stays null). Traditional names (Lias, Dogger, Malm) and inf./med./sup. qualifiers are resolved to full
    chart series, see data/scripts/terrain/geology_age_mapping.json (sources.veneto-litologia-250k).
  - Five classes occur only outside the Dolomites bbox (coastal and Euganean units) and are not in the mapping table.
  - The layer's advertised WFS typeName in the metadata (rv:c0501031_litologiareg) no longer exists; the server
    serves rv:c0501031_litologiareg_ (from its GetCapabilities, 2026-09-12).
processing:
  - step: "WFS GetFeature for the whole region as GeoJSON (EPSG:4326), metadata record saved, SHA-256"
    script: data/scripts/terrain/fetch_geology_veneto.py
    output: data/raw/veneto-litologia-250k/c0501031_litologiareg.geojson
  - step: "Clip to the Dolomites bbox, map depositi_a age text to ICS 2026-06 intervals, clip against South Tyrol and Trentino polygons, simplify per zoom, encode MVT into the merged archive"
