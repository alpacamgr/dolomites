caveats: |
  The paper's Data availability statement (Solid Earth 12, 885 (2021),
  Sect. 7) reads: "Our regional model for the Western Mediterranean-Alpine
  area is part of the global plate model of Muller et al. (2019), and all
  reconstructions and rotation files are available at
  https://www.earthbyte.org/webdav/ftp/Data_Collections/Muller_etal_2019_Tectonics/".
  Le Breton is a co-author on Muller 2019, and the Alpine rotations she
  contributed are layered into Muller_etal_2019_CombinedRotations.rot
  (verified by grep 'e Breton' on that file). There is no separate GPML/rot
  package to download for Le Breton 2021.
  Consequence: this dataset is not a distinct file in data/raw/ but a
  named component of earthbyte-muller2019. The globe pipeline treats
  Muller2019 as "muller2019+lebreton2021" for the 200-0 Ma window per the
  paper's own statement, and manifests both.
processing:
  - step: "None as a separate step - Le Breton rotations live in Muller_etal_2019_CombinedRotations.rot"
    script: data/scripts/plates/download.py
    output: (integrated in Muller2019 outputs)
