size_bytes: 410955896
checksum:
  algorithm: md5
  value: 2280c6c6f01a972a8cfa3ac75e080bf5
run_selection:
  filename: alpcyc.1km.epic.pp.ex.1ka.nc
  resolution: 1 km
  temperature_forcing: EPICA Dome C (Jouzel et al. 2007)
  precipitation_mode: palaeo-precipitation reduction (pp)
  rationale: >
    Reference run in Seguinot et al. 2018; the temperature record used to
    force the model matches the CENOGRID / PhanDA climate curves the site
    already ships, so time-series overlaid on the ice frames read from a
    single climate axis.
honesty_label: modeled
caveats: |
  Output of PISM (Parallel Ice Sheet Model), not observation. Resolution 1 km
  captures trunk-glacier geometry well but under-represents thin plateau ice.
  Time axis is cftime NoLeap years, converted to integer ka using ka = round(-year/1000);
  the initial (120 ka) state is not written, so labelled ages are 119..0 ka.
processing:
  - step: reproject to Web Mercator 2048 x 1488, colorize by thickness, write 16-bit thickness PNGs
    script: data/scripts/quaternary/build_ice_frames.py
    output: app/public/data/terrain/ice/{ka}.png, app/public/data/terrain/ice/thickness/{ka}.png
