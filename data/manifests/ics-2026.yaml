provider: International Commission on Stratigraphy (i-c-stratigraphy/chart on GitHub)
version: "2026-06 (owl:versionInfo in chart.ttl); data release tag v2026-06.5, commit 44d1043ecf295cce1be03b3fc5fa95ca65fe770b, 2026-06-29"
citation: >
  Cohen, K.M., Harper, D.A.T., Gibbard, P.L. & Car, N. (2025) The ICS
  International Chronostratigraphic Chart this decade. Episodes 48: 105-115.
  https://doi.org/10.18814/epiiugs/2025/025001. Chart version 2026-06, data
  from https://github.com/i-c-stratigraphy/chart (release v2026-06.5).
doi: 10.18814/epiiugs/2025/025001
landing_page: https://github.com/i-c-stratigraphy/chart
