honesty_label: interpreted
caveats: |
  The authors describe PaleoDEM outputs as "estimates" of land-surface elevation
  and ocean depth built from paleogeographic maps and seafloor age; no formal
  per-cell uncertainty is provided. At 0.1 deg the smallest resolved feature is
  about 11 km at the equator, so individual Alpine peaks, reef platforms, and
  small basins are not resolved. In some pre-Cretaceous slices the paleo-ocean
  floor shows polygon-shaped patches which reflect the block-by-block
  reconstruction methodology (patchwork of digitised paleo-ocean-floor
  polygons), not noise from our pipeline. We render the data as delivered and
  label the layer "interpreted".
processing:
  - step: "Verify MD5 checksum against Zenodo record"
    script: data/scripts/textures/download.py
    output: data/raw/scotese-paleodem-2018-v2/Scotese_Wright_2018_Maps_1-88_6minX6min_PaleoDEMS_nc.zip
  - step: "Unzip the 88 per-age netCDF files (5 Myr steps, 0-540 Ma)"
    script: data/scripts/textures/download.py
    output: data/raw/scotese-paleodem-2018-v2/nc/
  - step: "For each of {5, 10, ..., 300} Ma: flip to north-up, drop duplicated meridian column, resample with bicubic to 4096x2048 and 2048x1024, apply shared hypsometric palette, multiply-blend Horn hillshade (az 315, alt 45), compute tangent-space normal map (4k)"
    script: data/scripts/textures/render.py
    output: app/public/data/globe/textures/{2k,4k}/{age}.webp, app/public/data/globe/textures/4k/{age}-normal.webp
