caveats: |
  - License confirmed CC BY 4.0 via License.txt at
    https://www.earthbyte.org/webdav/ftp/Data_Collections/Muller_etal_2019_Tectonics/License.txt
    (fetched 2026-09-06). The Zenodo record 10525286 landing page also cites
    Creative Commons Attribution 4.0.
  - Files were fetched with gplately's PlateModelManager, which mirrors the
    EarthByte package. All layers used here (rotation, static polygons,
    topologies, continental polygons, coastlines, COBs) are those tagged
    'Muller2019' by the PlateModelManager and match the EarthByte v2.0
    Updated release by structure and naming.
  - The Muller 2019 model is a deforming-plate model. Individual plate
    polygons carry rigid rotations but the model also solves for strain
    inside deforming regions - the JSON we emit only reflects rigid
    polygon positions, not the intra-plate strain field.
  - Coverage ends at 250 Ma. For 300-251 Ma the build script switches to
    earthbyte-matthews2016 (410-0 Ma); see data/manifests/earthbyte-matthews2016.yaml.
  - The site cannot resolve the Dolomites (~100 km) as an independent block:
    the reference point 46.5N, 11.8E is assigned to plate id 307
    ("Southern Alps", part of Adria) and rides passively with it.
processing:
  - step: "Download combined rotations and topology/geometry layers via gplately.PlateModelManager"
    script: data/scripts/plates/download.py
    output: data/raw/earthbyte-muller2019/pm_manager/muller2019/
  - step: "Reconstruct continents, coastlines and resolve topologies to per-age GeoJSON (contract 1.2, 1.3)"
    script: data/scripts/plates/build.py
    output: app/public/data/globe/plates/{0..250}.json
