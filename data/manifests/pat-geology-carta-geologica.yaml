honesty_label: observed
caveats: |
  - Coverage is the Province of Trento only (Latemar, Predazzo, Tesero, Val di Fassa, Pale di San Martino west side,
    Marmolada south-west flank up to the provincial border).
  - Substrato (121 443 polygons, bedrock) and Sintemi (104 556, Quaternary cover) tile the surface without overlap
    (checked in a 15 x 15 km window around Latemar: intersection 0 m2). Sintemi is Depositi Quaternari plus Depositi
    di Frana with synthem names (same polygon count, symmetric difference 0 m2), so only Substrato and Sintemi are
    tiled; Depositi Quaternari/Frana supply the deposit type ('denom', one per tipo_qu code) used as lithology.
  - The shapefiles carry no ages. Ages come from the Servizio Geologico's unit legend PDF ("Eta:" statement per
    map symbol), extracted by data/scripts/terrain/extract_pat_unit_ages.py and joined on sigla_cart + nome.
    Members without their own statement take the statement of their formation (18 units); 65 units, among them
    the Predazzo and Monzoni plutons, the Monte Fernazza facies and the Formazione di Regnana, have no age
    statement in the unit descriptions. Since 2026-09-12 three groups of them are dated from cited legends
    (geology_age_mapping.json, sources.pat-geology-carta-geologica.unit_joins): the Predazzo and Monzoni pluton bodies
    take 'Triassic' from the map legend's own group heading "Corpi plutonici triassici di Predazzo e Monzoni" (age_basis
    source); the Monte Fernazza facies IMFb-IMFg take the formation's Ladinian (South Tyrol CARG IMF, PAT facies IMFa;
    legend_join); the Porfiroidi del Comelico take the Ordovician (envelope of the Veneto class age and ISPRA sheet 046;
    legend_join). The other units stay null. The age strings use substages (Pelsonico, Illirico, Fassanico ...)
    and qualifiers the ICS chart does not have; they are resolved to full chart intervals (outer envelopes),
    rules and judgement calls in data/scripts/terrain/geology_age_mapping.json (sources.pat-geology-carta-geologica).
  - Map symbols 'fl', 'fm' and 'ft' are used for different dyke sets in the legend; they are only resolved where
    the unit name matches exactly one of them.
  - 'area non rilevabile/non classificabile' (99), glaciers, anthropogenic deposits and permanent snow have no
    legend age and stay null.
  - The DBF files have no .cpg; they decode as Latin-1 (a grave 0xE0 etc.). A few names contain a literal '?'
    (0x3F) where the legend PDF has an apostrophe or dash ("SUBSINTEMA DI MALGA CAMPO D?ORSO",
    "Breccia tuff ? tuff"); that is the source's text and is kept.
processing:
  - step: "Download the four layer zips and three legend PDFs from the Geocatalogo / provincia.tn.it, with metadata records and SHA-256"
    script: data/scripts/terrain/fetch_geology_tn.py
    output: data/raw/pat-geology-carta-geologica/
  - step: "Extract the age statement of each unit from 'Descrizione delle Unita' (pdftotext) and join it to the shapefile map symbols"
    script: data/scripts/terrain/extract_pat_unit_ages.py
    output: data/scripts/terrain/geology_age_mapping.json (sources.pat-geology-carta-geologica.unit_ages)
  - step: "Reproject EPSG:25832 -> EPSG:4326, map age strings to ICS 2026-06 intervals, clip against South Tyrol polygons, simplify per zoom, encode MVT into the merged archive"
    script: data/scripts/terrain/build_geology_pmtiles.py
    output: app/public/data/terrain/geology-dolomites.pmtiles
