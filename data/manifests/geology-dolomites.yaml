honesty_label: observed
caveats: |
  - Priority South Tyrol > Trentino > Veneto > swisstopo > ISPRA 1:100k > GeoSphere 1:500k; a lower source only fills area
    that no higher source covers. The three gap-fill maps are much coarser (1:100,000 surveys of 1880-1980, 1:500,000) and
    must not be read as detailed mapping at z11-13; the meta gives each source's scale and a scale_note.
  - All sources form one polygon coverage (noded together), so neighbouring units share edges. At z8-z12 units smaller than
    about one tile pixel are merged into a neighbour (the area shows that neighbour's unit) and the coverage is simplified
    topologically; z13 is unsimplified.
  - Ages and colours are ICS chart boundary ages for the stage names the sources give, not ages published by the maps; the
    property age_basis says whether the age is the polygon's own map's (source), joined from another cited legend by
    formation name (legend_join) or a deposit-type rule (class_rule). Ages are withheld where the source's age is not a
    formation age or its attributes contradict each other (ISPRA per-unit review). See geology-dolomites.meta.json and
    data/scripts/terrain/geology_age_mapping.json.
  - Gaps remaining (geology-gaps.geojson): slivers along source and national borders.
processing:
  - step: "Read the six sources, map ages (ICS 2026-06, mapping table with evidence), node all boundaries into one coverage with priority, merge small units and coverage-simplify per zoom, encode MVT, write coverage outlines, gap polygons, preview and meta"
    script: data/scripts/terrain/build_geology_pmtiles.py (+ geology_gapfill_readers.py, review_ispra_100k_units.py)
    output: data/processed/terrain/geology-dolomites.pmtiles, app/public/data/terrain/geology-dolomites.meta.json, geology-coverage.geojson, geology-gaps.geojson
  - step: "Export static tiles"
    script: data/scripts/terrain/export_tiles.py --kind vector --template terrain/geology/{z}/{x}/{y}.pbf
    output: app/public/data/terrain/geology/
  - step: "Point-sampling check of the served tiles (per zoom covered / dated / missing vs z13 / bytes)"
    script: data/scripts/terrain/check_geology_tiles.py
    output: data/processed/terrain/geology-check/after.json (embedded in the meta)
