caveats: |
  - Chosen for the globe by docs/decisions/0005-globe-reference-frame.md: it is
    the PALEOMAP reference frame in which the PaleoDEM textures
    (scotese-paleodem-2018-v2) were built, so vectors and raster agree by
    construction. Checked by overlay at 20, 100 and 240 Ma
    (data/processed/plates/preview/overlay_{age}.png).
  - StaticPolygons, ContinentalPolygons and COBs are the same file (identical
    sha256). There is no Coastlines layer and no real continent-ocean boundary
    layer, so the globe JSON carries no coastline features.
  - The topologies carry no subduction polarity property; all subduction
    boundaries are emitted with polarity 'unknown'. Boundaries are coarse
    compared with Muller et al. 2019, especially around Adria and the Alps.
  - Topologies only cover 0-100 Ma: every topology feature (closed plate
    boundaries and boundary lines) begins at or after 100 Ma, so the globe
    JSON for 101-300 Ma has no boundary features.
  - Paleolatitude is model-dependent. Dolomites point at 240 Ma: this model
    7.3 N, Muller 2019 1.4 N, Muller 2022 8.6 N, Merdith 2021 11.8 N
    (ADR 0005); paleomagnetic data about 16-18 N (Muttoni et al. 1997,
    pending first-hand verification).
  - The Dolomites point (46.5 N, 11.8 E) falls on plate 307 (rotation file
    label 'ITL-AFR') and rides passively with it.
  - The Zenodo record was published as a PaleoDEM dataset; no separate DOI
    exists for the plate model files as packaged by PlateModelManager.
  - A partial earlier copy (Rotations and StaticPolygons only) exists in
    data/raw/earthbyte-scotese_and_wright2018/ and is not used by the pipeline.
processing:
