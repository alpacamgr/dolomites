    output: data/raw/scotese-wright-2018-model/scotese_and_wright2018/
  - step: "Reconstruct continental polygons, resolve topologies, partition and rotate the Dolomites point for 0-300 Ma (contract 1.2, 1.3)"
    script: data/scripts/plates/build.py
    output: app/public/data/globe/plates/{0..300}.json, index.json, meta.json; app/public/data/globe/dolomites-path.json
  - step: "Mollweide previews and texture overlays for frame verification"
    script: data/scripts/plates/preview.py
    output: data/processed/plates/preview/
