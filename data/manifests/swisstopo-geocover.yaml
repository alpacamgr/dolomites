caveats: |
  - Priority 4 in the merged Dolomites geology: fills the Swiss part of the terrain bbox (Lower Engadine, S-charl, Val Müstair,
    Samnaun; 10.3-10.49 E). Scale 1:25,000, the same as the South Tyrol map. 5 994 of the 8 638 polygons of the four sheets
    intersect the bbox (3 917 Bedrock_PLG, 2 077 Unconsolidated_Deposits_PLG).
  - Ages: CHRONO_TOP / RUNC_CHRONO_T is the younger bound and CHRONO_BASE / RUNC_CHRONO_B the older. Verified 2026-09-12 in the
    data model (2D Datenmodell Geologie GeoCover, Überarbeitung 4.4, April 2026, https://www.swisstopo.admin.ch/dam/en/sd-web/Np-QwyB4JAjX/datamodel-de.pdf):
    1.2.0.4 CHRONO_T "Obergrenze der Kartiereinheit (Top)", 1.2.0.5 CHRONO_B "Untergrenze der Kartiereinheit (Basis)";
    the bedrock caption of CHRONO_BASE (1.3.0.6) repeats "Obergrenze (Top)", apparently a copy error. Checked on the data: with
    the German-name table no row has TOP older than BASE (0 of 5 529 comparable bedrock rows, 0 of 2 887 unconsolidated rows).
  - 44 German names map to chart intervals (geology_age_mapping.json, sources.swisstopo-geocover.terms); 'Proterozoikum' ->
    Proterozoic (in chart.ttl, not in the app chart; used only as an older bound), 'Rhät' -> Rhaetian (traditional name,
    swisstopo lists it as the stage), 'frühes Paläozoikum' has no chart unit and stays null (222 rows get no colour).
  - Uncoloured by rule: open ranges Känozoikum|Proterozoikum, Känozoikum|Paläozoikum, and Phanerozoikum|Phanerozoikum or
    Mesozoikum|Proterozoikum where the description says pre-Permian Paleozoic (null_pairs); 35 Verspala-Fm. polygons in the bbox
    whose DESCRIPTION states "Campanien bis Maastrichtien" while the age fields say Cénomanien-Coniacien.
  - The bedrock and unconsolidated layers tile the ground; where they overlap (0.42% of sheet 1179, 0.07% of 1199) the
    unconsolidated deposit is drawn (judgement call; swisstopo documents no drawing order). The overlay layers (instabilities,
    karst, glacial, artificial, exploitation) are not used.
  - swisstopo is revising GeoCover (new version limited to Swiss territory).
processing:
  - step: "Download the 4 sheet zips from STAC (manual, 2026-09-12; URLs in checksums.json), SHA-256. No fetch script."
    output: data/raw/swisstopo-geocover/
  - step: "Extract the German GeoPackages, read Unconsolidated_Deposits_PLG then Bedrock_PLG, reproject EPSG:2056 -> EPSG:4326, keep polygons meeting the terrain bbox"
    script: data/scripts/terrain/geology_gapfill_readers.py
    output: data/raw/swisstopo-geocover/extracted/
  - step: "Map CHRONO_* German names to ICS 2026-06 intervals, apply null_pairs and the description check, merge into the gap-free coverage below the three provincial maps, generalise per zoom, encode MVT"
    script: data/scripts/terrain/build_geology_pmtiles.py
    output: data/processed/terrain/geology-dolomites.pmtiles -> app/public/data/terrain/geology/
