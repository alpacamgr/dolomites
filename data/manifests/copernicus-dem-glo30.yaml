  Copernicus Digital Elevation Model (DEM) was accessed on 2026-09-06 from
  https://registry.opendata.aws/copernicus-dem. (Citation text as given on the
  AWS registry; ESA dataset DOI from the Copernicus Data Space COP-DEM page.)
