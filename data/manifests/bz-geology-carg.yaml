caveats: |
  - Coverage is the Province of Bolzano / South Tyrol only, not the whole
    Dolomites: Trentino and Belluno provinces are covered separately (see
    terrain/wms.json).
  - Ages come as stratigraphic names in Italian and German, not numbers:
    ETA_CODICE_MIN_IT/DE is the unit's youngest age, ETA_CODICE_MAX_IT/DE its
    oldest. build_geology_pmtiles.py maps each distinct string to an ICS chart
    2026-06 interval through the checked-in table
    data/scripts/terrain/geology_age_mapping.json (German strings
    cross-checked) and takes age_min_ma / age_max_ma from the chart. For 255
    units (Formazione del Catinaccio CAT/CAT1/CATa, ZUU1) the source has the
    younger name in the MAX field; the two names are ordered by chart age
    before deriving the range and colour. These are
    the chart's boundary ages for the named intervals, not ages published by
    the map; strings qualified (p.p.) or (?) give an outer envelope. The two
    strings that cannot be mapped with confidence (Carbonifero superiore,
    Terziario (?)) stay null. Counts are in
    app/public/data/terrain/geology-suedtirol.meta.json.
  - The WFS layer's SLD legend colour is not exposed as a feature attribute.
    color in the PMTiles is the ICS chart colour of the unit's youngest named
    interval (conventional colouring by age), not the CARG legend colour.
  - GeoServer WFS BBOX filter only honoured EPSG:25832 (the native CRS) in
    this pass; sending an EPSG:4326 BBOX returned zero features, hence the
    reprojected filter in the fetch URL.
processing:
  - step: "WFS GetFeature paginated at 5000 features/call to GeoJSON"
    script: data/scripts/terrain/fetch_geology_bz.py
    output: data/raw/bz-geology-carg/GeologicalUnits-Detailed.geojson
  - step: "Map ETA_CODICE_MIN/MAX_IT age strings to ICS chart 2026-06 intervals (data/scripts/terrain/geology_age_mapping.json, German strings cross-checked), derive age_min_ma, age_max_ma, age_label and color; simplify per zoom, encode MVT, write vector PMTiles v3 via temp file + rename"
    script: data/scripts/terrain/build_geology_pmtiles.py
    output: app/public/data/terrain/geology-suedtirol.pmtiles
