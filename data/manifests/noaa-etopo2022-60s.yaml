caveats: |
  ETOPO 2022 is a compiled product built from bathymetric surveys, satellite
  altimetry-derived bathymetry, and land DEMs. Two co-registered variants are
  used here: the ice-surface grid (Greenland and Antarctica report the top of
  the ice) and the bedrock grid (the rock surface beneath any ice). Ice
  thickness derived by subtracting the two is only as precise as the coarser
  of the two component surveys and is not intended for glaciological work; at
  60" resolution it is used only to mask cells for a pale ice tint in the
  0 Ma texture. Bathymetry in unsurveyed abyssal areas is derived from
  satellite gravity and is less precise than shallow surveyed regions. For
  the globe textures we downsample from 21600x10800 to 4096x2048 and 2048x1024
  using Lanczos filtering; the result carries only as much detail as those
  coarser grids can hold. Sea level 0 uses EGM2008.
processing:
  - step: "Download the 60s ice-surface and bedrock netCDFs from NOAA THREDDS"
    script: data/scripts/textures/download.py
    output: data/raw/noaa-etopo2022-60s/ETOPO_2022_v1_60s_N90W180_{surface,bed}.nc
  - step: "Flip to north-up, downsample with Lanczos to 4096x2048 and 2048x1024, apply shared hypsometric palette, override cells where (surface - bedrock) > 50 m with the pale blue-white ice tint, multiply-blend Horn hillshade (az 315, alt 45), compute tangent-space normal map (4k) from the ice-surface grid"
    script: data/scripts/textures/render.py
    output: app/public/data/globe/textures/{2k,4k}/0.webp, app/public/data/globe/textures/4k/0-normal.webp, data/processed/textures/ice_mask.png
