honesty_label: observed
caveats: |
  - Priority 5 in the merged Dolomites geology: fills only what South Tyrol, Trentino, Veneto and swisstopo leave empty (the
    South Tyrol areas outside the published CARG sheets, e.g. Bolzano, Bletterbach, Brixen, Bruneck; the Lombardy edge; the
    Friuli corner). Scale 1:100,000 from historical sheets (surveys 1880-1980): 4x coarser than the South Tyrol map and 10x
    coarser than the Trentino map, old nomenclature (e.g. "morene würmiane"). The meta gives its scale and a scale_note; its
    polygons must not be read as detailed mapping at z11-13. It was not used to replace the Veneto map in Belluno.
  - The "nord" GML holds 3 730 GeologicUnit and 135 115 MappedFeature polygons; 45 118 polygons of 1 072 units intersect the
    terrain bbox.
  - Ages: each GeologicUnit has one GeologicEvent with olderNamedAge / youngerNamedAge as ICS chart URIs; names are split
    from CamelCase; 'Present' -> Holocene, 'Unknown' -> null, 'tortonian' -> Tortonian, 'MiddlePleistocene' -> Chibanian.
  - The event is not always the formation: for 244 of the 1 072 units eventProcess is metamorphicProcess (e.g. "ortogneiss
    granitici": Cenozoic; "fillade quarzifera di bressanone": Pennsylvanian). Those ages are the metamorphism and are never
    used for colour; faulting and unknown events likewise.
  - The join of unit name, legend description and event has systematic errors (e.g. "oliviniti" described as "Filladi
    quarzifere, spesso granatifere"; "dolomia dello sciliar" described as "Norico. - Dolomia principale" with age Ladinian).
    data/scripts/terrain/review_ispra_100k_units.py checks every unit in the bbox (name vs description lithology and wording,
    an age stated at the start of the description, and ISPRA's age vs the dated South Tyrol/Trentino/Veneto units under its
    polygons) and records one decision per unit in geology_age_mapping.json (sources.ispra-geologia-100k-inspire.units).
    Review of 2026-09-12 (second run, with description joins): 672 units keep ISPRA's age; 232 contradictory units are
    uncoloured; 18 contradictory units take the South Tyrol / Trentino legend age (legend_join): 16 by their own formation
    name (e.g. "arenarie di val gardena" -> Lopingian instead of ISPRA's Guadalupian) and 2 with a generic name whose
    description names exactly one formation (join_from description: GU_623 "arenarie quarzose ... (Arenarie di Val
    Gardena)" -> Lopingian, which covers the Bletterbach gorge; GU_201 "scisti argillosi rossi" described as Werfen ->
    Lopingian-Olenekian); 10 with a name/description mismatch between two Quaternary deposit types keep their Quaternary age;
    137 are uncoloured as metamorphic/faulting/unknown events (the other metamorphic units are among the contradictions);
    2 glacier/water units and 1 'Unknown' age stay null. The detailed-map check reads the previous build's ages, so the
    Veneto joins changed its verdict for 11 units (9 of them not in the tiles). The unit_name property is still ISPRA's name.
    A reviewer with geological training should check the units that fill the gaps (listed in the meta, ages.ispra_review).
  - The Atom feed's bbox attributes for the three zips look mislabelled ("nord" is advertised as "35.5 8.1 41.3 18.5");
    the downloaded "nord" file does cover northern Italy.
processing:
  - step: "Download the zip (manual, 2026-09-12), SHA-256. No fetch script."
    output: data/raw/ispra-geologia-100k-inspire/Carta_geologica_100k_INSPIRE-GE_nord.zip
  - step: "Stream-parse the GML (GeologicUnit attributes; MappedFeature polygons, lat/lon swapped) for polygons meeting the terrain bbox; cached"
    script: data/scripts/terrain/geology_gapfill_readers.py
    output: data/processed/terrain/geology-gapfill-cache/ispra-100k.pkl
  - step: "Per-unit age review (metamorphic events, contradictions, detailed-map cross-check, legend joins) written to the mapping table"
    script: data/scripts/terrain/review_ispra_100k_units.py
    output: data/scripts/terrain/geology_age_mapping.json
  - step: "Apply the review, merge into the gap-free coverage below the four higher-priority sources, generalise per zoom, encode MVT"
    script: data/scripts/terrain/build_geology_pmtiles.py
    output: data/processed/terrain/geology-dolomites.pmtiles -> app/public/data/terrain/geology/
