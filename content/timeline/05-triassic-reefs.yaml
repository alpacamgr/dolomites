id: triassic-reefs
title:
  en: "Platforms turned to mountains"
  de: "Plattformen, die zu Bergen wurden"
  it: "Piattaforme diventate montagne"
age_start_ma: 0.0
age_end_ma: 0.0
subject_age_start_ma: 247.0
subject_age_end_ma: 237.0
ics_stage: Anisian
ics_chart_version: "ICS 2026/06"
summary:
  en: "The Middle Triassic reefs are not painted here: they are the mountains themselves. Sciliar/Schlern, Latemar, Sella and Marmolada are the dolomitised remains of high-relief carbonate platforms that grew between deep basins, later lightly deformed and lifted almost intact into the sky. Colouring the modern terrain by rock unit draws the reefs on the peaks that carry their names."
  de: "Die mitteltriassischen Riffe werden hier nicht gemalt: sie sind die Berge selbst. Schlern/Sciliar, Latemar, Sella und Marmolada sind die dolomitisierten Reste von Karbonatplattformen mit hohem Relief zwischen tiefen Becken, später nur leicht verformt und fast unversehrt in die Höhe getragen. Die Einfärbung des heutigen Geländes nach Gesteinseinheit zeichnet die Riffe genau auf die Gipfel, die ihre Namen tragen."
  it: "Le scogliere del Triassico Medio non vengono dipinte qui: sono i monti stessi. Sciliar/Schlern, Latemar, Sella e Marmolada sono i resti dolomitizzati di piattaforme carbonatiche ad alto rilievo cresciute tra bacini profondi, poi solo leggermente deformate e sollevate quasi intatte. Colorare il terreno odierno per unità litologica disegna le scogliere sulle vette che ne portano il nome."
