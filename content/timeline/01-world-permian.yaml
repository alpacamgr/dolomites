facts:
  - text:
      en: "The globe's continents, coastlines and Dolomites marker come from the PALEOMAP plate model of Scotese & Wright 2018 for the whole range from 300 Ma to today, the same reconstruction on which the PaleoDEM is built, so outlines and relief share one reference frame. The model draws plate boundaries only for the last 100 million years, so none appear in this chapter."
      de: "Kontinente, Küstenlinien und die Markierung der Dolomiten auf dem Globus stammen für die ganze Spanne von 300 Ma bis heute aus dem PALEOMAP-Plattenmodell von Scotese & Wright 2018, derselben Rekonstruktion, auf der das PaleoDEM beruht; Umrisse und Relief teilen damit ein Bezugssystem. Plattengrenzen zeichnet das Modell nur für die letzten 100 Millionen Jahre, in diesem Kapitel also keine."
      it: "Continenti, linee di costa e l'indicatore delle Dolomiti sul globo provengono, per l'intero arco da 300 Ma a oggi, dal modello a placche PALEOMAP di Scotese & Wright 2018, la stessa ricostruzione su cui si basa il PaleoDEM; contorni e rilievo condividono così lo stesso sistema di riferimento. Il modello traccia i margini di placca solo per gli ultimi 100 milioni di anni, quindi in questo capitolo non ne compaiono."
    source_ref: "scotese-2018"
    confidence: established
  - text:
      en: "Paleomagnetic data show that the Southern Alps, including the Dolomites, a relatively unrotated remnant of the Adria margin, have moved in close conjunction with Africa since at least Permian times."
      de: "Paläomagnetische Daten zeigen, dass sich die Südalpen mit den Dolomiten, ein relativ unrotierter Rest des Adria-Randes, mindestens seit dem Perm in enger Verbindung mit Afrika bewegt haben."
      it: "I dati paleomagnetici mostrano che le Alpi Meridionali, Dolomiti comprese, resto relativamente non ruotato del margine di Adria, si sono mosse in stretta connessione con l'Africa almeno dal Permiano."
    source_ref: "muttoni-2001"
    confidence: established
  - text:
      en: "The Athesian Volcanic Group of the Southern Alps ranges from basaltic andesites to rhyolites; single-zircon U-Pb ages indicate that its volcanism lasted about 10 million years, between about 285 and 274 Ma."
      de: "Die Athesische Vulkangruppe der Südalpen reicht von basaltischen Andesiten bis zu Rhyolithen; U-Pb-Alter an Einzelzirkonen zeigen, dass ihr Vulkanismus rund 10 Millionen Jahre dauerte, zwischen etwa 285 und 274 Ma."
      it: "Il Gruppo Vulcanico Atesino delle Alpi Meridionali comprende rocce dalle andesiti basaltiche alle rioliti; le età U-Pb su singoli zirconi indicano che il suo vulcanismo durò circa 10 milioni di anni, tra circa 285 e 274 Ma."
    value: "about 285 to 274 Ma"
    source_ref: "marocchi-2008"
    confidence: established
  - text:
      en: "The Ora Ignimbrite, about 275 Ma, is a supereruption-sized rhyolite of about 1300 km3 and the final eruptive product of the Athesian Volcanic Group, which the same study calls the largest Permian volcanic district in Europe and dates to 289 to 274 Ma."
      de: "Der Auer-Ignimbrit (Ora), rund 275 Ma alt, ist ein Rhyolith in Supereruptions-Größe von etwa 1300 km3 und das letzte Eruptionsprodukt der Athesischen Vulkangruppe, die dieselbe Studie als größten permischen Vulkandistrikt Europas bezeichnet und auf 289 bis 274 Ma datiert."
      it: "L'Ignimbrite di Ora, circa 275 Ma, è una riolite di dimensioni da super-eruzione, circa 1300 km3, e l'ultimo prodotto eruttivo del Gruppo Vulcanico Atesino, che lo stesso studio definisce il maggiore distretto vulcanico permiano d'Europa e data a 289 - 274 Ma."
    value: "about 1300 km3"
    source_ref: "chiaro-2024"
    confidence: established
