id: world-permian
title:
  en: "Pangea and the Bolzano volcanoes"
  de: "Pangaea und die Bozner Vulkane"
  it: "La Pangea e i vulcani di Bolzano"
age_start_ma: 300.0
age_end_ma: 252.0
ics_stage: Permian
ics_chart_version: "ICS 2026/06"
summary:
  en: "The Permian world was one continent. What will become the Dolomites sits inside Pangea, close to the equator, above the eroded roots of the Variscan mountains. In the Early Permian a huge silicic volcanic complex, the Athesian Group, erupts across the future Bolzano/Bozen area."
  de: "In der permischen Welt gab es einen einzigen Kontinent. Die spätere Dolomitenregion liegt tief in Pangaea, nahe dem Äquator, über den abgetragenen Wurzeln des variszischen Gebirges. Im frühen Perm bricht über dem heutigen Bozen ein riesiger silikatischer Vulkankomplex aus, die Athesische Gruppe."
  it: "Il mondo permiano è un solo continente. Ciò che diventeranno le Dolomiti si trova dentro la Pangea, vicino all'equatore, sopra le radici erose delle catene varisciche. All'inizio del Permiano un grande complesso vulcanico silicico, il Gruppo Atesino, erutta sull'area della futura Bolzano/Bozen."
