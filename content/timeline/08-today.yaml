id: today
title:
  en: "What is still moving"
  de: "Was sich noch bewegt"
  it: "Cosa è ancora in movimento"
age_start_ma: 0.0
age_end_ma: 0.0
ics_stage: Meghalayan
ics_chart_version: "ICS 2026/06"
summary:
  en: "The story does not end. Since the Little Ice Age the Alpine glaciers have lost more than half of their area and almost two thirds of their volume; the small glaciers of the Dolomites are melting faster still. The ground itself continues to rise. This chapter draws the closing frame and asks what the next scroll of the story will look like."
  de: "Die Geschichte endet nicht. Seit der Kleinen Eiszeit haben die alpinen Gletscher mehr als die Hälfte ihrer Fläche und fast zwei Drittel ihres Volumens verloren; die kleinen Gletscher der Dolomiten schrumpfen noch schneller. Der Boden selbst hebt sich weiter. Dieses Kapitel setzt den Schlussrahmen und fragt, wie das nächste Kapitel aussehen wird."
  it: "La storia non finisce. Dalla Piccola Età Glaciale i ghiacciai alpini hanno perso oltre metà della loro superficie e quasi due terzi del volume; i piccoli ghiacciai delle Dolomiti si stanno sciogliendo ancora più in fretta. Il terreno continua a sollevarsi. Questo capitolo chiude il quadro e chiede come sarà la prossima pagina."
