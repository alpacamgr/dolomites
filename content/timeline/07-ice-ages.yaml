id: ice-ages
title:
  en: "Under the ice"
  de: "Unter dem Eis"
  it: "Sotto il ghiaccio"
age_start_ma: 0.120
age_end_ma: 0.0
subject_age_start_ma: 0.12
subject_age_end_ma: 0.0
ics_stage: Pleistocene  # epoch, not a stage
ics_chart_version: "ICS 2026/06"
summary:
  en: "The last glacial cycle covered the Alps in ice. A published ice-sheet model, run at 1 km, replays 120 thousand years of thickening and thinning over the real terrain. Only the highest Dolomite peaks stood above the ice as nunataks. When the ice left, the valleys were unlocked and huge rockslides collapsed into them, some in prehistoric times, one within recorded human memory."
  de: "Der letzte Vereisungszyklus legte die Alpen in Eis. Ein publiziertes Eisschildmodell mit 1 km Auflösung spielt über dem realen Gelände 120.000 Jahre Anwachsen und Zerfallen ab. Nur die höchsten Dolomitengipfel ragten als Nunataks aus dem Eis. Als das Eis wich, waren die Täler entriegelt; große Bergstürze fielen in sie hinein, einige in vorgeschichtlicher Zeit, einer im menschlichen Gedächtnis."
  it: "L'ultimo ciclo glaciale ha coperto le Alpi di ghiaccio. Un modello di calotta pubblicato, girato a 1 km, ripercorre 120 mila anni di crescita e ritiro sul terreno reale. Solo le vette più alte delle Dolomiti emergevano come nunatak. Quando il ghiaccio se ne andò, le valli si liberarono e grandi frane vi caddero dentro, alcune in tempi preistorici, una entro la memoria storica."
