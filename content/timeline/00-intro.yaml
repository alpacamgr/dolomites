summary:
  en: "The stage the whole story returns to: the modern terrain as it is measured today, and the four honesty labels the site uses to keep data and decoration apart."
  de: "Der Ort, zu dem die ganze Geschichte zurückkehrt: das heutige Gelände, wie es gemessen wurde, und die vier Ehrlichkeits-Etiketten der Seite."
  it: "Il palcoscenico a cui tutta la storia torna: il terreno odierno, così come è misurato, e le quattro etichette di onestà con cui il sito distingue dato e ornamento."
