facts:
  - text:
      en: "The terrain view uses TINITALY, the 10 m digital elevation model of Italy published by INGV."
      de: "Die Geländedarstellung nutzt TINITALY, das 10-Meter-Höhenmodell Italiens des INGV."
      it: "La vista del terreno usa TINITALY, il modello digitale del terreno d'Italia a 10 m pubblicato dall'INGV."
    value: "10 m"
    source_ref: "tarquini-2023"
    confidence: established
  - text:
      en: "For areas outside Italy the site falls back to Copernicus DEM GLO-30, a 30 m global model."
      de: "Außerhalb Italiens wird auf das globale Copernicus-DEM GLO-30 mit 30 m ausgewichen."
      it: "Fuori dall'Italia il sito ripiega sul Copernicus DEM GLO-30, modello globale a 30 m."
    value: "30 m"
    source_ref: "copernicus-dem"
    confidence: established
  - text:
      en: "Within South Tyrol, the geological units shown on the terrain come from the province's open geology dataset (CC0) wherever its map sheets are published."
      de: "Innerhalb Südtirols stammen die Geologie-Einheiten aus dem freien Geologie-Datensatz der Provinz (CC0), soweit dessen Kartenblätter veröffentlicht sind."
      it: "In Alto Adige le unità geologiche mostrate provengono dal dataset geologico aperto della Provincia di Bolzano (CC0), dove i suoi fogli sono pubblicati."
    source_ref: "bolzano-geologia"
    confidence: established
