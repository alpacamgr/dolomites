summary:
  en: "The Dolomites are the internal, lightly deformed part of a young thrust belt. Great faults frame them: the Periadriatic-Insubric line to the north, the Giudicarie fault system to the west, the Valsugana thrust system to the south. Miocene shortening carried the Triassic rocks skywards without crumpling them; the range is still rising today at about a millimetre a year."
  de: "Die Dolomiten sind der innere, nur schwach verformte Teil eines jungen Faltengebirges. Große Störungen rahmen sie ein: die Periadriatische Insubrische Linie im Norden, das Giudicarie-System im Westen, die Valsugana-Überschiebungen im Süden. Miozäne Einengung hob die triassischen Gesteine in den Himmel, ohne sie zu zerknittern; das Gebirge steigt bis heute mit rund einem Millimeter pro Jahr."
  it: "Le Dolomiti sono la parte interna e poco deformata di una catena a pieghe e faglie giovane. Grandi lineamenti le incorniciano: la linea Periadriatico-Insubrica a nord, il sistema di faglie delle Giudicarie a ovest, il sistema dei sovrascorrimenti della Valsugana a sud. L'accorciamento miocenico ha portato in alto le rocce triassiche senza spiegazzarle; la catena continua a sollevarsi ancora oggi di circa un millimetro all'anno."
