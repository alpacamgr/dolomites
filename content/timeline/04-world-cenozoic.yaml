title:
  en: "Collision and the birth of the Alps"
  de: "Kollision und die Geburt der Alpen"
  it: "Collisione e nascita delle Alpi"
age_start_ma: 66.0
age_end_ma: 0.0
ics_stage: Cenozoic
ics_chart_version: "ICS 2026/06"
summary:
  en: "The Alpine Tethys closes. Adria pushes into Europe, oceanic crust is consumed, and the Alps rise. On the plate-model view we can follow Adria's northward path; on this scale the Dolomites are only a marker on it. What Adria actually is - a promontory of Africa or an independent microplate - has been debated for a century."
  de: "Die Alpine Tethys schließt sich. Adria drückt in Europa hinein, ozeanische Kruste wird verschluckt, und die Alpen erheben sich. Im Plattenmodell verfolgen wir den Nordkurs Adrias; die Dolomiten sind auf dieser Skala nur eine Marke darauf. Was Adria wirklich ist - ein Sporn Afrikas oder eine eigene Mikroplatte - wird seit einem Jahrhundert diskutiert."
  it: "La Tetide Alpina si chiude. Adria si spinge dentro l'Europa, la crosta oceanica viene consumata, le Alpi si sollevano. Nel modello a placche seguiamo la traiettoria settentrionale di Adria; a questa scala le Dolomiti sono solo un segno posto su di essa. Che cosa sia Adria - un promontorio dell'Africa o una microplacca autonoma - è oggetto di dibattito da un secolo."
