facts:
  - text:
      en: "Two long-standing views of Adria coexist in the literature: an African promontory that never separated substantially from Africa, and an independent microplate divided from Africa by an intervening oceanic domain. Jolivet notes that paleomagnetic error bars alone cover several hundred kilometres and cannot settle the question."
      de: "In der Literatur bestehen zwei langlebige Sichten auf Adria: ein afrikanischer Sporn, der sich nie wesentlich von Afrika löste, und eine eigenständige Mikroplatte, die durch ein zwischenliegendes Ozeansegment von Afrika getrennt war. Jolivet weist darauf hin, dass die paläomagnetischen Fehlerbalken allein mehrere hundert Kilometer umspannen und die Frage nicht klären können."
      it: "In letteratura convivono due letture di Adria di lunga data: un promontorio dell'Africa mai davvero separato, e una microplacca indipendente divisa dall'Africa da un dominio oceanico interposto. Jolivet ricorda che le sole barre d'errore paleomagnetiche coprono diverse centinaia di chilometri e non risolvono la questione."
    source_ref: "jolivet-2023"
    confidence: debated
  - text:
      en: "For the Alpine kinematics the narrative relies on Müller et al. 2019, whose Alpine sector is internally consistent with the Le Breton et al. 2021 regional update; the globe itself is drawn from the PALEOMAP model of Scotese & Wright 2018."
      de: "Für die alpine Kinematik stützt sich der Text auf Müller et al. 2019, dessen alpiner Ausschnitt mit der regionalen Fortschreibung von Le Breton et al. 2021 verträglich ist; der Globus selbst wird nach dem PALEOMAP-Modell von Scotese & Wright 2018 gezeichnet."
      it: "Per la cinematica alpina il testo si basa su Müller et al. 2019, il cui settore alpino è coerente con l'aggiornamento regionale di Le Breton et al. 2021; il globo è invece disegnato secondo il modello PALEOMAP di Scotese & Wright 2018."
    source_ref: "muller-2019"
    confidence: established
  - text:
      en: "The Southern Eastern Alps, including the Dolomites, are still rising: the ALPS2017 GNSS solution measures vertical uplift of about 1.0 to 1.5 mm per year in this sector."
      de: "Die Südlichen Ostalpen mit den Dolomiten heben sich weiterhin: die GNSS-Lösung ALPS2017 misst hier vertikale Hebungen von etwa 1,0 bis 1,5 mm pro Jahr."
      it: "Le Alpi Sud-Orientali, Dolomiti comprese, continuano a sollevarsi: la soluzione GNSS ALPS2017 misura in questo settore un sollevamento verticale di circa 1,0 - 1,5 mm all'anno."
    value: "1.0 to 1.5 mm/yr"
    source_ref: "sanchez-2018"
    confidence: established
