facts:
  - text:
      en: "The regional Le Breton et al. 2021 reconstruction treats Adria as two plates, northern (Ivrea) and southern (Apulia), and models the Piemont-Liguria basin opening in four stages between 200 and 83 Ma."
      de: "Die regionale Rekonstruktion von Le Breton et al. 2021 behandelt Adria als zwei Platten, Nord (Ivrea) und Süd (Apulien), und modelliert die Öffnung des Piemont-Liguria-Beckens in vier Etappen zwischen 200 und 83 Ma."
      it: "La ricostruzione regionale di Le Breton et al. 2021 tratta Adria come due placche, settentrionale (Ivrea) e meridionale (Apulia), e modella l'apertura del bacino di Piemonte-Liguria in quattro fasi tra 200 e 83 Ma."
    source_ref: "lebreton-2021"
    confidence: established
  - text:
      en: "The mature Piemont-Liguria ocean reached, in this model, a maximum width of about 250 km of oceanic crust; that is much narrower than the wide Tethys of school atlases."
      de: "Nach diesem Modell erreicht der reife Piemont-Liguria-Ozean eine maximale Breite von etwa 250 km ozeanischer Kruste, deutlich schmaler als die weite Tethys aus Schulatlanten."
      it: "In questo modello l'oceano di Piemonte-Liguria maturo raggiunge una larghezza massima di circa 250 km di crosta oceanica, molto più stretto della vasta Tetide degli atlanti scolastici."
    value: "up to about 250 km"
    source_ref: "lebreton-2021"
    confidence: established
  - text:
      en: "The Bosellini, Gianolla and Stefani synthesis records the Dolomites' Permian to Cretaceous sedimentary succession as the passive margin of Tethys, with the Middle Jurassic marking the oceanic break-up."
      de: "Die Zusammenschau von Bosellini, Gianolla und Stefani beschreibt die Sedimentabfolge der Dolomiten vom Perm bis in die Kreide als passiven Rand der Tethys, mit dem ozeanischen Aufbrechen im Mittleren Jura."
      it: "La sintesi di Bosellini, Gianolla e Stefani descrive la successione sedimentaria delle Dolomiti dal Permiano al Cretaceo come margine passivo della Tetide, con la rottura oceanica nel Giurassico Medio."
    source_ref: "bosellini-2003"
    confidence: established
