id: world-jurassic-cretaceous
title:
  en: "Adria drifts, the Alpine Tethys opens"
  de: "Adria wandert, die Alpine Tethys öffnet sich"
  it: "Adria migra, si apre la Tetide Alpina"
age_start_ma: 201.0
age_end_ma: 66.0
ics_stage: Jurassic-Cretaceous
ics_chart_version: "ICS 2026/06"
summary:
  en: "The single continent breaks apart. A narrow ocean, the Alpine Tethys and its Piemont-Liguria basin, opens between Europe and Adria. The Dolomites, still marine, drown beneath white pelagic mud and dark red ammonite-bearing limestones. What is now a mountain range spends most of these 135 million years as a piece of continental shelf, then of deep sea floor."
  de: "Der Superkontinent zerbricht. Zwischen Europa und Adria öffnet sich ein schmaler Ozean, die Alpine Tethys mit ihrem Piemont-Liguria-Becken. Die noch marinen Dolomiten versinken unter weißem Pelagikschlamm und tiefroten Ammoniten-Kalken. Was heute ein Gebirge ist, verbringt den größten Teil dieser 135 Millionen Jahre als Kontinentalschelf und dann als Tiefsee-Boden."
  it: "Il continente unico si frantuma. Tra Europa e Adria si apre un oceano stretto, la Tetide Alpina con il suo bacino di Piemonte-Liguria. Le Dolomiti, ancora marine, affondano sotto fango pelagico bianco e calcari rosso scuro con ammoniti. Ciò che oggi è una catena montuosa passa la maggior parte di questi 135 milioni di anni come piattaforma continentale, poi come fondale profondo."
