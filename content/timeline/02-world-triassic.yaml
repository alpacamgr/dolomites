id: world-triassic
title:
  en: "Tethys, tropics and reefs"
  de: "Tethys, Tropen und Riffe"
  it: "La Tetide, i tropici e le scogliere"
age_start_ma: 252.0
age_end_ma: 201.0
ics_stage: Triassic
ics_chart_version: "ICS 2026/06"
summary:
  en: "Pangea begins to open. A warm, shallow arm of the Tethys ocean spreads over what is now northern Italy. Adria drifts across the northern tropics. On this shelf, carbonate platforms grow into towers separated by deep basins, and a brief pulse of volcanoes cuts through them. The globe view cannot show these reefs; the next chapter, on the terrain, does."
  de: "Pangaea beginnt sich zu öffnen. Ein warmer, flacher Arm der Tethys breitet sich über Norditalien aus. Adria zieht durch die nördlichen Tropen. Auf diesem Schelf wachsen Karbonatplattformen zu Türmen zwischen tiefen Becken, und ein kurzer Vulkanpuls durchschneidet sie. Die Globusansicht kann die Riffe nicht zeigen; das leistet das nächste Kapitel im Gelände."
  it: "La Pangea comincia ad aprirsi. Un braccio caldo e poco profondo della Tetide si distende sull'Italia settentrionale. Adria migra attraverso i tropici settentrionali. Su questa piattaforma le scogliere carbonatiche crescono in torri separate da bacini profondi, mentre un breve impulso vulcanico le taglia. Il globo non può mostrare queste scogliere; lo fa il capitolo successivo, sul terreno."
